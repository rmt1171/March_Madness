<style>
:root{
  --bg:#f7f6f3;
  --card:#ffffff;
  --border:#e8e7e3;
  --border2:#d4d3ce;
  --text:#111110;
  --text2:#6b6a65;
  --text3:#a8a7a2;
  --green:#16a34a;--green-bg:#f0fdf4;
  --red:#dc2626;--red-bg:#fef2f2;
  --blue:#2563eb;--blue-bg:#eff6ff;
  --amber:#d97706;--amber-bg:#fffbeb;
  --radius:10px;--radius-sm:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
/* HEADER */
header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px}
.logo{display:flex;align-items:baseline;gap:10px}
.logo-title{font-size:18px;font-weight:700;letter-spacing:-.4px}
.logo-sub{font-size:11px;color:var(--text3);font-weight:400}
.header-right{display:flex;align-items:center;gap:10px}
.upd{font-size:11px;color:var(--text3)}
.rbtn{padding:6px 14px;border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--card);cursor:pointer;font-size:12px;font-family:inherit;font-weight:500;color:var(--text2);transition:all .15s}
.rbtn:hover{background:var(--bg);border-color:var(--text3)}
.live-badge{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--green);font-weight:600}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
/* NAV */
nav{background:var(--card);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
.nav-btn{padding:12px 18px;border:none;border-bottom:2px solid transparent;background:transparent;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--text3);font-weight:500;font-family:inherit;transition:all .15s}
.nav-btn:hover{color:var(--text2)}
.nav-btn.on{border-bottom-color:var(--text);color:var(--text);font-weight:600}
/* MAIN */
main{max-width:900px;margin:0 auto;padding:16px 14px}
.tab{display:none}.tab.on{display:block}
/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.card-pad{padding:16px 18px}
/* METRICS */
.mrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px}
.met{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px}
.met-label{font-size:11px;color:var(--text3);margin-bottom:3px;font-weight:500}
.met-val{font-size:20px;font-weight:700;letter-spacing:-.5px}
/* STANDINGS ROWS */
.srow{display:flex;align-items:center;gap:11px;padding:12px 16px;border-bottom:1px solid var(--border)}
.srow:last-child{border-bottom:none}
.rank{font-size:12px;color:var(--text3);min-width:18px;font-family:'DM Mono',monospace}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0;font-family:'DM Mono',monospace}
.sinfo{flex:1;min-width:0}
.sname{font-weight:600;font-size:14px}
.sbracket{font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.bar{height:3px;background:var(--border);border-radius:99px;margin-top:6px;overflow:hidden}
.bfill{height:100%;border-radius:99px;transition:width .4s ease}
.spts{text-align:right;margin-right:8px}
.spts-big{font-size:24px;font-weight:700;letter-spacing:-.5px;line-height:1}
.spts-sub{font-size:11px;color:var(--text3);margin-top:1px}
.champ-pill{padding:3px 9px;border-radius:5px;font-size:11px;font-weight:600;white-space:nowrap}
/* GAME GRID */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.gc{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;transition:border-color .2s}
.gc.live{border-color:#86efac;background:#f0fdf4}
.gc.final{border-color:var(--border)}
.gt{font-size:10px;color:var(--text3);margin-bottom:9px;display:flex;align-items:center;gap:4px;font-weight:500;text-transform:uppercase;letter-spacing:.3px}
.gt.is-live{color:var(--green)}
.ldot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;animation:pulse 1.2s infinite;flex-shrink:0}
.trow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.tname{font-size:13px;font-weight:400;flex:1;padding-right:4px}
.tname.win{font-weight:700}
.tscore{font-family:'DM Mono',monospace;font-size:15px;font-weight:500;flex-shrink:0}
.tscore.win{font-weight:700}
.pickers{font-size:10px;min-height:15px;margin-bottom:6px;font-weight:500}
.pickers.has{color:var(--blue)}
.pickers.won{color:var(--green)}
.pickers.no{color:var(--border2)}
.slbl{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 9px;display:flex;align-items:center;gap:6px}
/* PICKS */
.ptabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:13px}
.ptab{padding:5px 12px;border-radius:7px;border:1px solid var(--border);background:var(--card);font-size:12px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;font-weight:500;color:var(--text2);transition:all .15s}
.ptab:hover{border-color:var(--border2)}
.ptab-av{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;font-family:'DM Mono',monospace;flex-shrink:0}
.phdr{display:flex;align-items:center;gap:13px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.phdr-av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;font-family:'DM Mono',monospace}
.phdr-name{font-weight:700;font-size:16px;letter-spacing:-.3px}
.phdr-bracket{font-size:12px;color:var(--text3);margin-top:2px}
.phdr-pts{font-size:30px;font-weight:700;letter-spacing:-.5px;line-height:1}
.phdr-sub{font-size:11px;color:var(--text3);margin-top:2px}
.psec{margin-bottom:14px}
.plbl{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{padding:3px 10px;border-radius:5px;font-size:11px;font-weight:500;transition:all .2s}
.chip.ok{background:var(--green-bg);color:var(--green)}
.chip.out{background:var(--red-bg);color:var(--red);text-decoration:line-through}
.chip.live{background:var(--blue-bg);color:var(--blue)}
.chip.pend{background:var(--bg);color:var(--text3);border:1px solid var(--border)}
.leg{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:11px;color:var(--text3)}
.leg span{display:flex;align-items:center;gap:5px}
/* COMPARE */
.ctbl{width:100%;border-collapse:collapse;font-size:12px;min-width:460px}
.ctbl th{text-align:center;padding:6px 4px;font-weight:600;font-size:11px;color:var(--text2)}
.ctbl th:first-child{text-align:left}
.ctbl td{padding:7px 4px;border-top:1px solid var(--border);text-align:center}
.ctbl td:first-child{text-align:left;color:var(--text3);font-size:11px}
.cpill{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:500}
.cpill.same{background:var(--green-bg);color:var(--green)}
.cpill.diff{background:var(--red-bg);color:var(--red)}
.cpill.mix{background:var(--blue-bg);color:var(--blue)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:8px;margin-top:10px}
.cc{background:var(--bg);border-radius:var(--radius-sm);padding:10px 12px}
.cc-team{font-weight:600;font-size:13px}
.cc-names{font-size:11px;color:var(--text3);margin-top:2px}
.note{font-size:12px;color:var(--text2);line-height:2}
.note b{color:var(--text)}
.ibox{background:var(--bg);border-radius:var(--radius-sm);padding:12px 14px;font-size:12px;color:var(--text2);line-height:1.8;margin-top:10px}
.ibox b{color:var(--text)}
/* RESPONSIVE */
@media(max-width:500px){
  .spts-big{font-size:20px}
  .phdr-pts{font-size:24px}
  header{padding:10px 14px}
  main{padding:12px 10px}
}
</style>

    r64: ["Duke","Ohio St.","Kansas","Cal Baptist","Louisville","Michigan St.","UCLA","Connecticut","Florida","Iowa","Vanderbilt","Nebraska","N. Carolina","Pennsylvania","Texas A&M","Houston","Arkansas","Wisconsin","BYU","Gonzaga","Villanova","Arizona","Miami FL","Purdue","Kentucky","Iowa St.","Michigan","Georgia","Alabama","Texas Tech","Tennessee","Virginia"] },

    ff:  ["Duke","Florida","Arizona","Michigan St."],

    s16: ["Duke","St. John's","Michigan St.","Connecticut","Florida","Nebraska","N. Carolina","Houston","Arizona","High Point","Texas","Gonzaga","Iowa St.","Virginia","Michigan","Alabama"],

// R64 results — hardcoded (ESPN drops old games after ~48hrs)
const R64 = {
  "Duke":1,"TCU":1,"St. John's":1,"Kansas":1,"Louisville":1,"Michigan St.":1,"VCU":1,
  "Connecticut":1,"Florida":1,"Iowa":1,"Vanderbilt":1,"Nebraska":1,"Illinois":1,
  "Texas A&M":1,"Houston":1,"Arkansas":1,"Gonzaga":1,"Texas":1,"Kentucky":1,

  "Cal Baptist":0,"Furman":0,"BYU":0,"Santa Clara":0,
};

// Live results — populated from ESPN on refresh
let RES = { r32:{}, s16:{}, e8:{}, ff:{}, champ:{} };
let GAMES = [];
let selP = 0, curTab = "stand";

// ═══════════════════════════════════════════════════════
// ESPN FETCH
// ═══════════════════════════════════════════════════════
const NM = {
  "Florida Gators":"Florida","Duke Blue Devils":"Duke","Michigan Wolverines":"Michigan",
  "Michigan State Spartans":"Michigan St.","Michigan State":"Michigan St.",
  "Iowa State Cyclones":"Iowa St.","Iowa State":"Iowa St.",

};
const N = s => NM[s] || s;

function getRound(hl, date) {
  const h = (hl||"").toLowerCase();
  if (h.includes("first round"))   return null;
  if (h.includes("second round"))  return "r32";
  if (h.includes("sweet 16") || h.includes("sweet sixteen")) return "s16";
  if (h.includes("elite eight") || h.includes("elite 8"))    return "e8";
  if (h.includes("final four"))    return "ff";
  if (h.includes("championship"))  return "champ";
  try {
    const d=new Date(date), mo=d.getMonth(), dy=d.getDate();
    if (mo===2) { if(dy<=20)return null; if(dy<=22)return"r32"; if(dy<=27)return"s16"; return"e8"; }
    if (mo===3) return dy<=5 ? "ff" : "champ";
  } catch(e) {}
  return null;
}

async function doFetch() {
  document.getElementById("upd").textContent = "Updating...";
  const URL = "https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/scoreboard?groups=100&limit=100";
  let data = null;
  try { const r = await fetch(URL); data = await r.json(); } catch(e) {}

  if (!data || !data.events) {
    document.getElementById("upd").textContent = "ESPN unavailable — check back soon";
    render(); return;
  }

  const newRES = { r32:{}, s16:{}, e8:{}, ff:{}, champ:{} };
  const newGames = [];
  let hasLive = false;

  for (const ev of data.events) {
    try {
      const comp  = ev.competitions[0];
      const state = ev.status.type.state;
      const comps = comp.competitors || [];
      if (comps.length < 2) continue;
      const home = comps.find(c=>c.homeAway==="home") || comps[0];
      const away = comps.find(c=>c.homeAway==="away") || comps[1];
      const hN = N(home.team.shortDisplayName || home.team.displayName);
      const aN = N(away.team.shortDisplayName || away.team.displayName);
      const hS = parseInt(home.score) || 0;
      const aS = parseInt(away.score) || 0;
      const hW = home.winner === true || (state==="post" && hS>aS && hS>0);
      const aW = away.winner === true || (state==="post" && aS>hS && aS>0);
      if (state === "in") hasLive = true;
      newGames.push({ hN, aN, hS, aS, hW, aW, state,
        clock: ev.status.displayClock || "",
        period: ev.status.period || 0,
        date: ev.date });
      if (state === "post") {
        const hl = ((comp.notes||[])[0]||{}).headline || "";
        const rk = getRound(hl + " " + (ev.status.type.shortDetail||""), ev.date);
        if (rk) {
          if (hW) { newRES[rk][hN]=1; newRES[rk][aN]=0; }
          else if (aW) { newRES[rk][aN]=1; newRES[rk][hN]=0; }
        }
      }
    } catch(e) { continue; }
  }

  RES   = newRES;
  GAMES = newGames;
  document.getElementById("upd").textContent = "Updated " + new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
  const lb = document.getElementById("live-badge");
  lb.style.display = hasLive ? "flex" : "none";
  render();
}

// ═══════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════
function score(p) {
  let n = p.r64pts;
  p.s16.forEach(t => { if(RES.r32[t]===1) n+=2; });
  p.e8.forEach(t  => { if(RES.s16[t]===1) n+=4; });
  p.ff.forEach(t  => { if(RES.e8[t]===1)  n+=8; });
  if (RES.ff[p.champion]===1)    n+=16;
  if (RES.champ[p.champion]===1) n+=32;
  return n;
}

function whoHas(t) {
  return POOL.filter(p =>
    p.r64.includes(t) || p.s16.includes(t) ||
    p.e8.includes(t)  || p.ff.includes(t)  || p.champion===t
  ).map(p => p.name);
}

function chipSt(t, rnd) {
  if (R64[t]===0) return "out";
  if (RES[rnd] && RES[rnd][t]===1) return "ok";
  if (RES[rnd] && RES[rnd][t]===0) return "out";
  if (GAMES.some(g => g.state==="in" && (g.hN===t||g.aN===t))) return "live";
  return "pend";
}

function champSt(t) {
  if (R64[t]===0) return "out";
  for (const r of ["r32","s16","e8","ff"]) if (RES[r]&&RES[r][t]===0) return "out";
  if (RES.champ[t]===1) return "ok";
  if (RES.champ[t]===0) return "out";
  return "alive";
}

// ═══════════════════════════════════════════════════════
// NAV
// ═══════════════════════════════════════════════════════
function go(id, btn) {
  curTab = id;
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("on"));
  btn.classList.add("on");
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("on"));
  document.getElementById(id).classList.add("on");
  render();
}
function render() {
  ({ stand:rStand, games:rGames, picks:rPicks, cmp:rCmp })[curTab]?.();
}

// ═══════════════════════════════════════════════════════
// STANDINGS
// ═══════════════════════════════════════════════════════
function rStand() {
  const rows = POOL.map(p=>({...p,pts:score(p)})).sort((a,b)=>b.pts-a.pts);
  const top  = rows[0].pts;
  const r32w = Object.values(RES.r32).filter(v=>v===1).length;

  let h = `<div class="mrow">
    <div class="met"><div class="met-label">Leader</div><div class="met-val">${top} pts</div></div>
    <div class="met"><div class="met-label">Spread</div><div class="met-val">${top-rows.at(-1).pts} pts</div></div>
    <div class="met"><div class="met-label">R32 done</div><div class="met-val">${r32w}/16</div></div>
    <div class="met"><div class="met-label">Entries</div><div class="met-val">7</div></div>
  </div><div class="card">`;

  rows.forEach((p,i) => {
    const b  = p.pts - p.r64pts;
    const cs = champSt(p.champion);
    const pc = cs==="ok"?"var(--green)":cs==="out"?"var(--red)":"var(--amber)";
    const pbg= cs==="ok"?"var(--green-bg)":cs==="out"?"var(--red-bg)":"var(--amber-bg)";
    h += `<div class="srow">
      <div class="rank">${i+1}</div>
      <div class="av" style="width:36px;height:36px;background:${p.color}22;color:${p.color}">${p.name.slice(0,2).toUpperCase()}</div>
      <div class="sinfo">
        <div class="sname">${p.name}</div>
        <div class="sbracket">${p.bracket}</div>
        <div class="bar"><div class="bfill" style="width:${Math.round(p.pts/Math.max(top,1)*100)}%;background:${p.color}"></div></div>
      </div>
      <div class="spts">
        <div class="spts-big">${p.pts}</div>
        <div class="spts-sub">${b>0?"+"+b+" today":"base "+p.r64pts}</div>
      </div>
      <div><span class="champ-pill" style="background:${pbg};color:${pc};${cs==="out"?"text-decoration:line-through":""}">${p.champion}</span></div>
    </div>`;
  });

  h += `</div>
  <div class="ibox">
    <b>After R64:</b> Adam 28 · Zach/Reid 27 · Zack 26 · Harrison 24 · Jacob/Steven 23<br>
    <span style="color:var(--text3)">Scoring: R32 +2pts · S16 +4pts · E8 +8pts · FF +16pts · Champion +32pts</span>
  </div>`;
  document.getElementById("stand").innerHTML = h;
}

// ═══════════════════════════════════════════════════════
// GAMES
// ═══════════════════════════════════════════════════════
function rGames() {
  const el   = document.getElementById("games");
  const live = GAMES.filter(g=>g.state==="in");
  const done = GAMES.filter(g=>g.state==="post");
  const pre  = GAMES.filter(g=>g.state==="pre");

  if (!GAMES.length) {
    el.innerHTML = `<div style="text-align:center;padding:50px;color:var(--text3)">
      <div style="font-size:32px;margin-bottom:12px">🏀</div>
      <div style="font-weight:600;margin-bottom:6px">No games loaded yet</div>
      <div style="font-size:12px">Hit ↻ Refresh in the top right to load live scores</div>
    </div>`;
    return;
  }

  const gc = g => {
    const isL = g.state==="in", isF = g.state==="post";
    const aH  = whoHas(g.aN), hH = whoHas(g.hN);
    const time = isF ? "Final"
      : isL ? (g.period ? `P${g.period} ${g.clock}` : g.clock||"Live")
      : (g.date ? new Date(g.date).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}) : "TBD");
    const aCls = aH.length ? (g.aW&&isF?"won":"has") : "no";
    const hCls = hH.length ? (g.hW&&isF?"won":"has") : "no";
    return `<div class="gc${isL?" live":isF?" final":""}">
      <div class="gt${isL?" is-live":""}">${isL?'<span class="ldot"></span>':''}${time}</div>
      <div class="trow">
        <span class="tname${g.aW?" win":""}">${g.aN}</span>
        ${isF||isL?`<span class="tscore${g.aW?" win":""}">${g.aS}</span>`:""}
      </div>
      <div class="pickers ${aCls}">${aH.length?aH.join(", "):"—"}</div>
      <div class="trow">
        <span class="tname${g.hW?" win":""}">${g.hN}</span>
        ${isF||isL?`<span class="tscore${g.hW?" win":""}">${g.hS}</span>`:""}
      </div>
      <div class="pickers ${hCls}">${hH.length?hH.join(", "):"—"}</div>
    </div>`;
  };

  let h = "";
  if (live.length) h += `<div class="slbl"><span class="ldot"></span>Live right now</div><div class="ggrid">${live.map(gc).join("")}</div>`;
  if (done.length) h += `<div class="slbl">✅ Final</div><div class="ggrid">${done.map(gc).join("")}</div>`;
  if (pre.length)  h += `<div class="slbl">🕐 Upcoming</div><div class="ggrid">${pre.map(gc).join("")}</div>`;
  el.innerHTML = h || `<div style="text-align:center;padding:40px;color:var(--text3)">No games found</div>`;
}

// ═══════════════════════════════════════════════════════
// PICKS
// ═══════════════════════════════════════════════════════
function rPicks() {
  const btns = POOL.map((p,i) => `
    <button class="ptab" style="${i===selP?`border-color:${p.color};color:${p.color};background:${p.color}11`:""}"
      onclick="selP=${i};rPicks()">
      <span class="ptab-av" style="background:${p.color}33;color:${p.color}">${p.name.slice(0,2).toUpperCase()}</span>
      ${p.name}
    </button>`).join("");

  const p   = POOL[selP];
  const pts = score(p);
  const cs  = champSt(p.champion);
  const pc  = cs==="ok"?"var(--green)":cs==="out"?"var(--red)":"var(--amber)";
  const pbg = cs==="ok"?"var(--green-bg)":cs==="out"?"var(--red-bg)":"var(--amber-bg)";

  const chip = (t, rnd) => {
    const s = rnd==="champ"
      ? (()=>{ const c=champSt(t); return c==="alive"?"pend":c; })()
      : chipSt(t, rnd);
    return `<span class="chip ${s}">${t}</span>`;
  };
  const sec = (lbl, items, rnd) => `
    <div class="psec">
      <div class="plbl">${lbl}</div>
      <div class="chips">${items.map(t=>chip(t,rnd)).join("")}</div>
    </div>`;

  document.getElementById("picks").innerHTML = `
    <div class="ptabs">${btns}</div>
    <div class="card card-pad">
      <div class="phdr">
        <div class="phdr-av" style="width:48px;height:48px;background:${p.color}22;color:${p.color}">${p.name.slice(0,2).toUpperCase()}</div>
        <div style="flex:1">
          <div class="phdr-name">${p.name}</div>
          <div class="phdr-bracket">${p.bracket}</div>
        </div>
        <div style="text-align:right">
          <div class="phdr-pts">${pts}</div>
          <div class="phdr-sub">base ${p.r64pts} · +${pts-p.r64pts} bonus</div>
        </div>
        <span class="champ-pill" style="background:${pbg};color:${pc}">${p.champion}</span>
      </div>
      ${sec("Champion — +32pts", [p.champion], "champ")}
      ${sec("Final Four — +8pts each", p.ff, "e8")}
      ${sec("Elite Eight — +4pts each", p.e8, "s16")}
      ${sec("Sweet Sixteen — +2pts each", p.s16, "r32")}
      <div class="leg">
        <span><span class="chip ok" style="margin:0">✓</span> Correct</span>
        <span><span class="chip out" style="margin:0">✗</span> Eliminated</span>
        <span><span class="chip live" style="margin:0">▶</span> Live now</span>
        <span><span class="chip pend" style="margin:0">○</span> Upcoming</span>
      </div>
    </div>`;
}

// ═══════════════════════════════════════════════════════
// COMPARE
// ═══════════════════════════════════════════════════════
function rCmp() {
  const scored = POOL.map(p=>({...p,pts:score(p)}));
  const cmap   = {};
  POOL.forEach(p => { (cmap[p.champion] = cmap[p.champion]||[]).push(p.name); });
  const regs = ["East","South","West","Midwest"];
  const hdrs = POOL.map(p=>`<th style="color:${p.color}">${p.name}</th>`).join("");
  const trows= regs.map((r,ri)=>{
    const vals=POOL.map(p=>p.ff[ri]);
    const u=[...new Set(vals)];
    const cls=u.length===1?"same":u.length===vals.length?"diff":"mix";
    return `<tr><td>${r}</td>${vals.map(v=>`<td><span class="cpill ${cls}">${v}</span></td>`).join("")}</tr>`;
  }).join("");
  const ptrow = `<tr style="border-top:2px solid var(--border2)"><td style="font-weight:600">Score</td>${POOL.map(p=>`<td style="font-weight:700;font-size:15px">${scored.find(s=>s.name===p.name).pts}</td>`).join("")}</tr>`;
  const ccards= Object.entries(cmap).map(([t,ns])=>`<div class="cc"><div class="cc-team">${t}</div><div class="cc-names">${ns.join(", ")}</div></div>`).join("");

  document.getElementById("cmp").innerHTML = `
    <div class="card card-pad" style="overflow-x:auto">
      <div style="font-weight:600;margin-bottom:12px;font-size:15px">Final Four picks</div>
      <table class="ctbl"><thead><tr><th></th>${hdrs}</tr></thead><tbody>${trows}${ptrow}</tbody></table>
    </div>
    <div class="card card-pad">
      <div style="font-weight:600;margin-bottom:4px;font-size:15px">Champion picks</div>
      <div class="cgrid">${ccards}</div>
    </div>
    <div class="card card-pad">
      <div style="font-weight:600;margin-bottom:10px;font-size:15px">Key divergences to watch</div>
      <div class="note">
        <b>East:</b> 5/7 have Duke in FF. Zack alone has St. John's (+16 swing). Zach alone has Michigan St. (+16 swing).<br>
        <b>South:</b> Most have Florida. Harrison alone has Houston reaching FF.<br>
        <b>West:</b> 5/7 have Arizona. Reid alone has Arkansas — exclusive points every single round if Arkansas runs.<br>
        <b>Midwest:</b> Reid/Zach/Adam → Iowa St. vs Zack/Jacob/Steven/Harrison → Michigan = 16pt swing at FF alone.<br>
        <b>Champion:</b> Michigan (Zack) · Duke (Jacob) · Michigan St. (Steven) · Arizona (Harrison+Adam) · Florida (Reid+Zach)
      </div>
    </div>`;
}

// ═══════════════════════════════════════════════════════
// INIT — render immediately, then fetch live scores
// ═══════════════════════════════════════════════════════
render();
doFetch();
setInterval(doFetch, 60000); // auto-refresh every 60 seconds
</script>
</body>
</html>

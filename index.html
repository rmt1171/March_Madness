<style>

.hright{display:flex;align-items:center;gap:10px}
.upd{font-size:11px;color:var(--text3)}

main{max-width:900px;margin:0 auto;padding:16px 14px}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.cp{padding:16px 18px}
.mrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px}
.met{background:var(--card);border:1px solid var(--border);border-radius:var(--rs);padding:11px 13px}
.ml{font-size:11px;color:var(--text3);margin-bottom:3px;font-weight:500}

.rank{font-size:12px;color:var(--text3);min-width:18px;font-family:'DM Mono',monospace}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0;font-family:'DM Mono',monospace}
.sinfo{flex:1;min-width:0}
.sname{font-weight:600;font-size:14px}
.sbkt{font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.bar{height:3px;background:var(--border);border-radius:99px;margin-top:6px;overflow:hidden}
.bfill{height:100%;border-radius:99px}
.spts{text-align:right;margin-right:8px}
.spts-n{font-size:24px;font-weight:700;letter-spacing:-.5px;line-height:1}

.cpill{padding:3px 9px;border-radius:5px;font-size:11px;font-weight:600;white-space:nowrap}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.gc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px}
.gc.live{border-color:#86efac;background:#f0fdf4}
.gt{font-size:10px;color:var(--text3);margin-bottom:9px;display:flex;align-items:center;gap:4px;font-weight:500;text-transform:uppercase;letter-spacing:.3px}

.tn{font-size:13px;flex:1;padding-right:4px}.tn.win{font-weight:700}

.chip.out{background:var(--red-bg);color:var(--red);text-decoration:line-through}

.leg{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:11px;color:var(--text3)}
.ctbl{width:100%;border-collapse:collapse;font-size:12px;min-width:500px}

// ═══════════════════════════════════════════════════════════════════
// SCORING
// ═══════════════════════════════════════════════════════════════════
function calcScore(name) {
  const player = PLAYERS.find(p=>p.name===name);
  let pts = player.r64pts;
  // Only score games marked as final to prevent ESPN data from corrupting future slots
  ALL_GAMES.forEach(g => {
    if (g.status === "final" && g.winner && g.p && g.p[name] === g.winner) pts += g.pts;
  });
  return pts;
}

const N = s => NM[s] || s;
 
function getRound(hl, date) {
  // ESPN round naming:
  // "First Round"  = R64 → skip (already in r64pts)
  // "Second Round" = R32 (our Round of 32)
  // "Sweet 16"     = S16, "Elite Eight" = E8, etc.
  const h = (hl||"").toLowerCase();
  if (h.includes("first round"))   return null;
  if (h.includes("second round"))  return "R32";
  if (h.includes("sweet 16") || h.includes("sweet sixteen")) return "S16";
  if (h.includes("elite eight") || h.includes("elite 8"))    return "E8";
  if (h.includes("final four"))    return "FF";
  if (h.includes("championship"))  return "Champ";
  try {
    const d=new Date(date),mo=d.getMonth(),dy=d.getDate();
    if(mo===2){if(dy<=20)return null;if(dy<=22)return"R32";if(dy<=27)return"S16";return"E8";}
    if(mo===3&&dy<=6)return"FF";
    if(mo===3&&dy===7)return"Champ";
    // Don't guess for other dates — only match on headline text
  } catch(e){}
  return null;
}
 
let selP=0, curTab="stand", gameFilter="R32";
 
async function doFetch() {
  document.getElementById("upd").textContent="Updating...";
  const URL="https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/scoreboard?groups=100&limit=100";
  let data=null;
  try { const r=await fetch(URL); data=await r.json(); } catch(e) {}
  if (!data||!data.events) { document.getElementById("upd").textContent="ESPN offline"; render(); return; }
 
  let hasLive=false;
  // Store live ESPN games by round for display
  const espnByRound = {R32:[],S16:[],E8:[],FF:[],Champ:[]};
 
  for (const ev of data.events) {
    try {
      const comp=ev.competitions[0];
      const state=ev.status.type.state;
      const comps=comp.competitors||[];
      if(comps.length<2)continue;
      const home=comps.find(c=>c.homeAway==="home")||comps[0];
      const away=comps.find(c=>c.homeAway==="away")||comps[1];
      const hN=N(home.team.shortDisplayName||home.team.displayName);
      const aN=N(away.team.shortDisplayName||away.team.displayName);
      const hS=parseInt(home.score)||0;
      const aS=parseInt(away.score)||0;
      const hW=home.winner===true||(state==="post"&&hS>aS&&hS>0);
      const aW=away.winner===true||(state==="post"&&aS>hS&&aS>0);
      if(state==="in")hasLive=true;
      const hl=((comp.notes||[])[0]||{}).headline||"";
      const rk=getRound(hl+" "+(ev.status.type.shortDetail||""),ev.date);
      if(!rk) continue;
 
      const gameData = {
        away:aN, home:hN, awayS:aS, homeS:hS,
        status: state==="post"?"final":state==="in"?"live":"upcoming",
        winner: state==="post"?(hW?hN:aW?aN:null):null,
        clock: ev.status.displayClock||"",
        period: ev.status.period||0,
        rnd: rk,
      };
 
      // For R32: also update our hardcoded picks array so scoring works
      if(rk==="R32") {
        const g=R32.find(g=>(g.away===aN&&g.home===hN)||(g.away===hN&&g.home===aN));
        if(g){
          const fl=(g.away===hN);
          g.awayS=fl?hS:aS; g.homeS=fl?aS:hS;
          g.status=gameData.status;
          g.winner=gameData.winner;
          if(state==="in"){g.clock=gameData.clock;g.period=gameData.period;}
        }
      }
 
      // For S16+: only update game arrays if we can match by exact team names
      // NEVER fall back to "first upcoming slot" — that corrupts future game data
      if(rk==="S16"||rk==="E8"||rk==="FF"||rk==="Champ") {
        const arr = rk==="S16"?S16:rk==="E8"?E8:rk==="FF"?FF:CHAMP;
        const g = arr.find(g=>(g.away===aN&&g.home===hN)||(g.away===hN&&g.home===aN));
        if(g){
          const fl=(g.away===hN&&g.home===aN);
          g.awayS=fl?hS:aS; g.homeS=fl?aS:hS;
          g.status=gameData.status;
          g.winner=gameData.winner;
          if(state==="in"){g.clock=gameData.clock;g.period=gameData.period;}
        }
      }
 
      if(espnByRound[rk]) espnByRound[rk].push(gameData);
    } catch(e){continue;}
  }
 
  // Store for display
  window._espnByRound = espnByRound;
  document.getElementById("live-badge").style.display=hasLive?"flex":"none";
  document.getElementById("upd").textContent="Updated "+new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
  render();
}
 
function go(id,btn){
  curTab=id;
  document.querySelectorAll(".nb").forEach(b=>b.classList.remove("on"));
  btn.classList.add("on");
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("on"));
  document.getElementById(id).classList.add("on");
  render();
}
function render(){({stand:rStand,games:rGames,picks:rPicks,cmp:rCmp})[curTab]?.();}
 
// ═══════════════════════════════════════════════════════════════════
// STANDINGS
// ═══════════════════════════════════════════════════════════════════
function rStand(){
  const rows=PLAYERS.map(p=>({...p,pts:calcScore(p.name)})).sort((a,b)=>b.pts-a.pts);
  const top=rows[0].pts;
  const r32done=R32.filter(g=>g.status==="final").length;
  let h=`<div class="mrow">
    <div class="met"><div class="ml">Leader</div><div class="mv">${top} pts</div></div>
    <div class="met"><div class="ml">Spread</div><div class="mv">${top-rows.at(-1).pts} pts</div></div>
    <div class="met"><div class="ml">R32 done</div><div class="mv">${r32done}/16</div></div>
    <div class="met"><div class="ml">Entries</div><div class="mv">7</div></div>
  </div><div class="card">`;
  rows.forEach((p,i)=>{
    const b=p.pts-p.r64pts;
    const champG=ALL_GAMES.find(g=>g.rnd==="Champ");
    const champAlive=!champG||champG.status!=="final"||champG.winner===p.champion;
    const pc=champAlive?"var(--amber)":"var(--red)";
    const pb=champAlive?"var(--amber-bg)":"var(--red-bg)";
    const st=champAlive?"":"text-decoration:line-through";
    h+=`<div class="srow">
      <div class="rank">${i+1}</div>
      <div class="av" style="width:36px;height:36px;background:${p.color}22;color:${p.color}">${p.name.slice(0,2).toUpperCase()}</div>
      <div class="sinfo">
        <div class="sname">${p.name}</div>
        <div class="sbkt">${p.bracket}</div>
        <div class="bar"><div class="bfill" style="width:${Math.round(p.pts/Math.max(top,1)*100)}%;background:${p.color}"></div></div>
      </div>
      <div class="spts"><div class="spts-n">${p.pts}</div><div class="spts-s">${b>0?"+"+b+" bonus":"base "+p.r64pts}</div></div>
      <div><span class="cpill" style="background:${pb};color:${pc};${st}">${p.champion}</span></div>
    </div>`;
  });
  h+=`</div><div class="ibox">
    <b>R64 baselines:</b> Adam 28 · Zach/Reid 27 · Zack 26 · Harrison 24 · Jacob/Steven 23<br>
    <span style="color:var(--text3)">R32 +2 · S16 +4 · E8 +8 · FF +16 · Championship +32</span>
  </div>`;
  document.getElementById("stand").innerHTML=h;
}
 
// ═══════════════════════════════════════════════════════════════════
// GAMES
// ═══════════════════════════════════════════════════════════════════
function setFilter(f,btn){
  gameFilter=f;
  document.querySelectorAll(".rbtn2").forEach(b=>b.classList.remove("on"));
  btn.classList.add("on");
  rGames();
}
 
function rGames(){
  const rnds=["R32","S16","E8","FF","Champ"];
  const labels={"R32":"Round of 32","S16":"Sweet 16","E8":"Elite 8","FF":"Final Four","Champ":"Championship"};
  const filters=rnds.map((r,i)=>`<button class="rbtn2${r===gameFilter?" on":""}" onclick="setFilter('${r}',this)">${labels[r]}</button>`).join("");
 
  // For R32: use our hardcoded array (picks are per-game)
  // For S16+: use ESPN live data if available, otherwise show picks-based TBD cards
  const gc=(g, rnd)=>{
    const isL=g.status==="live",isF=g.status==="final";
    const aTeam=g.away||"TBD", hTeam=g.home||"TBD";
 
    // Who has each team: for R32 use game's p[] object
    // For S16+: search each person's picks for that round
    let awayP=[], homeP=[];
    if(rnd==="R32" && g.p) {
      awayP=NAMES.filter(n=>g.p[n]===aTeam);
      homeP=NAMES.filter(n=>g.p[n]===hTeam);
    } else {
      // For S16+: find who picked each team to WIN a game in this round
      const roundPicks = rnd==="S16"?S16:rnd==="E8"?E8:rnd==="FF"?FF:CHAMP;
      // Find the matching game in our picks array
      const pg = roundPicks.find(g2=>(g2.away===aTeam&&g2.home===hTeam)||(g2.away===hTeam&&g2.home===aTeam));
      if(pg) {
        awayP=NAMES.filter(n=>pg.p[n]===aTeam);
        homeP=NAMES.filter(n=>pg.p[n]===hTeam);
      } else if(aTeam!=="TBD"&&hTeam!=="TBD") {
        // Teams known but no matching game — look up picks dynamically
        awayP=NAMES.filter(n=>roundPicks.some(g2=>g2.p[n]===aTeam));
        homeP=NAMES.filter(n=>roundPicks.some(g2=>g2.p[n]===hTeam));
      }
    }
 
    const time=isF?"Final":isL?(g.period?`P${g.period} ${g.clock||""}`:g.clock||"Live"):"Upcoming";
    const aCls=awayP.length?(isF?(g.winner===aTeam?"won":"lost"):"has"):"no";
    const hCls=homeP.length?(isF?(g.winner===hTeam?"won":"lost"):"has"):"no";
    return`<div class="gc${isL?" live":""}">
      <div class="gt${isL?" islive":""}">${isL?'<span class="ldot"></span>':''}${time}</div>
      <div class="trow"><span class="tn${isF&&g.winner===aTeam?" win":""}">${aTeam}</span>${isF||isL?`<span class="ts${isF&&g.winner===aTeam?" win":""}">${g.awayS??""}</span>`:""}</div>
      <div class="prow ${aCls}">${awayP.length?awayP.join(", "):"—"}</div>
      <div class="trow"><span class="tn${isF&&g.winner===hTeam?" win":""}">${hTeam}</span>${isF||isL?`<span class="ts${isF&&g.winner===hTeam?" win":""}">${g.homeS??""}</span>`:""}</div>
      <div class="prow ${hCls}">${homeP.length?homeP.join(", "):"—"}</div>
    </div>`;
  };
 
  let h=`<div class="rnd-filter">${filters}</div>`;
 
  if(gameFilter==="R32") {
    const games=R32;
    const live=games.filter(g=>g.status==="live");
    const done=games.filter(g=>g.status==="final");
    const up  =games.filter(g=>g.status==="upcoming");
    if(live.length)h+=`<div class="slbl"><span class="ldot"></span>Live</div><div class="ggrid">${live.map(g=>gc(g,"R32")).join("")}</div>`;
    if(done.length)h+=`<div class="slbl">✅ Final</div><div class="ggrid">${done.map(g=>gc(g,"R32")).join("")}</div>`;
    if(up.length)  h+=`<div class="slbl">🕐 Upcoming</div><div class="ggrid">${up.map(g=>gc(g,"R32")).join("")}</div>`;
  } else {
    // For S16+: only show games ESPN actually reports — no projections
    const espn = (window._espnByRound||{})[gameFilter]||[];
 
    if(espn.length) {
      const live=espn.filter(g=>g.status==="live");
      const done=espn.filter(g=>g.status==="final");
      const up  =espn.filter(g=>g.status==="upcoming");
      if(live.length)h+=`<div class="slbl"><span class="ldot"></span>Live</div><div class="ggrid">${live.map(g=>gc(g,gameFilter)).join("")}</div>`;
      if(done.length)h+=`<div class="slbl">✅ Final</div><div class="ggrid">${done.map(g=>gc(g,gameFilter)).join("")}</div>`;
      if(up.length)  h+=`<div class="slbl">🕐 Upcoming</div><div class="ggrid">${up.map(g=>gc(g,gameFilter)).join("")}</div>`;
    } else {
      h+=`<div style="padding:50px;text-align:center;color:var(--text3)">
        <div style="font-size:28px;margin-bottom:12px">🕐</div>
        <div style="font-weight:600;margin-bottom:6px">TBD</div>
        <div style="font-size:12px">Matchups update automatically once games are confirmed</div>
      </div>`;
    }
  }
  document.getElementById("games").innerHTML=h;
}
 
// ═══════════════════════════════════════════════════════════════════
// PICKS
// ═══════════════════════════════════════════════════════════════════
function rPicks(){
  const btns=PLAYERS.map((p,i)=>`
    <button class="ptab" style="${i===selP?`border-color:${p.color};color:${p.color};background:${p.color}11`:""}" onclick="selP=${i};rPicks()">
      <span class="ptab-av" style="background:${p.color}33;color:${p.color}">${p.name.slice(0,2).toUpperCase()}</span>
      ${p.name}
    </button>`).join("");
  const p=PLAYERS[selP], pts=calcScore(p.name);
 
  const R64_LOSERS=new Set(["N. Carolina","Wisconsin","Ohio St.","Siena","South Florida","Troy","McNeese","N. Dak. St.","Howard","St. Mary's","Pennsylvania","Georgia","Idaho","Kennesaw St.","Hawaii","Villanova","Akron","LIU","Wright St.","Tennessee St.","Hofstra","Miami OH","Clemson","Northern Iowa","UCF","Queens Univ.","Prairie View A&M","Missouri","Cal Baptist","Furman","BYU","Santa Clara"]);
 
  const chipFor=(g)=>{
    const pick=g.p[p.name];
    if(!pick||pick==="—")return"";
    let st="pend";
    if(R64_LOSERS.has(pick)) st="out";
    else if(g.status==="final"&&g.winner===pick) st="ok";
    else if(g.status==="final"&&g.winner&&g.winner!==pick) st="out";
    else if(g.status==="live") st="live";
    return`<span class="chip ${st}" title="${g.away} vs ${g.home}">${pick}</span>`;
  };
 
  const sec=(lbl,games)=>`<div class="psec"><div class="plbl">${lbl}</div><div class="chips">${games.map(chipFor).join("")}</div></div>`;
 
  document.getElementById("picks").innerHTML=`
    <div class="ptabs">${btns}</div>
    <div class="card cp">
      <div class="phdr">
        <div class="phdr-av" style="width:48px;height:48px;background:${p.color}22;color:${p.color}">${p.name.slice(0,2).toUpperCase()}</div>
        <div style="flex:1"><div class="phdr-n">${p.name}</div><div class="phdr-b">${p.bracket}</div></div>
        <div style="text-align:right"><div class="phdr-pts">${pts}</div><div class="phdr-sub">base ${p.r64pts} · +${pts-p.r64pts} bonus</div></div>
        <span class="cpill" style="background:var(--amber-bg);color:var(--amber)">${p.champion}</span>
      </div>
      ${sec("Round of 32 — +2pts each",R32)}
      ${sec("Sweet 16 — +4pts each",S16)}
      ${sec("Elite 8 — +8pts each",E8)}
      ${sec("Final Four — +16pts each",FF)}
      ${sec("Championship — +32pts",CHAMP)}
      <div class="leg">
        <span><span class="chip ok" style="margin:0">✓</span> Correct</span>
        <span><span class="chip out" style="margin:0">✗</span> Eliminated</span>
        <span><span class="chip live" style="margin:0">▶</span> Live</span>
        <span><span class="chip pend" style="margin:0">○</span> Upcoming</span>
      </div>
    </div>`;
}
 
// ═══════════════════════════════════════════════════════════════════
// COMPARE
// ═══════════════════════════════════════════════════════════════════
function rCmp(){
  const scored=PLAYERS.map(p=>({...p,pts:calcScore(p.name)}));
  const cmap={};
  PLAYERS.forEach(p=>{(cmap[p.champion]=cmap[p.champion]||[]).push(p.name);});
  const hdrs=PLAYERS.map(p=>`<th style="color:${p.color}">${p.name}</th>`).join("");
  const ptrow=`<tr style="border-top:2px solid var(--border2)"><td style="font-weight:600">Score</td>${PLAYERS.map(p=>`<td style="font-weight:700;font-size:15px">${scored.find(s=>s.name===p.name).pts}</td>`).join("")}</tr>`;
 
  const mkTable=(games)=>{
    const rows=games.map(g=>{
      const isF=g.status==="final";
      const cells=PLAYERS.map(p=>{
        const pk=g.p[p.name];
        const won=isF&&g.winner===pk;
        const lost=isF&&g.winner&&g.winner!==pk;
        const c=won?"var(--green)":lost?"var(--red)":"var(--text2)";
        const s=lost?"text-decoration:line-through":"";
        return`<td><span style="font-size:11px;color:${c};${s}">${pk||"—"}</span></td>`;
      }).join("");
      const label=g.rnd==="Champ"?"Championship":`${g.away.length>10?g.away.slice(0,10)+"…":g.away} / ${g.home.length>10?g.home.slice(0,10)+"…":g.home}`;
      return`<tr><td>${label}</td>${cells}</tr>`;
    }).join("");
    return`<table class="ctbl"><thead><tr><th>Game</th>${hdrs}</tr></thead><tbody>${rows}${ptrow}</tbody></table>`;
  };
 
  const ccards=Object.entries(cmap).map(([t,ns])=>`<div class="cc"><div style="font-weight:600;font-size:13px">${t}</div><div style="font-size:11px;color:var(--text3);margin-top:2px">${ns.join(", ")}</div></div>`).join("");
 
  document.getElementById("cmp").innerHTML=`
    <div class="card cp" style="overflow-x:auto">
      <div style="font-weight:600;margin-bottom:10px;font-size:15px">R32 picks</div>
      ${mkTable(R32)}
    </div>
    <div class="card cp" style="overflow-x:auto">
      <div style="font-weight:600;margin-bottom:10px;font-size:15px">S16 picks</div>
      ${mkTable(S16)}
    </div>
    <div class="card cp" style="overflow-x:auto">
      <div style="font-weight:600;margin-bottom:10px;font-size:15px">E8 picks</div>
      ${mkTable(E8)}
    </div>
    <div class="card cp" style="overflow-x:auto">
      <div style="font-weight:600;margin-bottom:10px;font-size:15px">FF + Championship picks</div>
      ${mkTable([...FF,...CHAMP])}
    </div>
    <div class="card cp">
      <div style="font-weight:600;margin-bottom:4px;font-size:15px">Champion picks</div>
      <div class="cgrid">${ccards}</div>
    </div>`;
}
 
render();
doFetch();
setInterval(doFetch,60000);
</script>
